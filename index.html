<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>普通話詞語大闖關</title>
<style>
:root{
  --ink:#2C2C2B; --ink2:#7D7A75; --line:#E6E5E3; --soft:#F9F8F7; --soft2:#F1F0EE;
  --blue:#2783DE; --blue-d:#1B66B0; --green:#3E9E6B; --green-d:#2F7E54;
  --orange:#FF8A3D; --orange-d:#E2621B;   --red:#E5584C; --pink:#FF6F91;
  --sky1:#BFE3FA; --sky2:#E7F4FD; --hill1:#BCE0C9; --hill2:#CDE8D6;
  --grass:#7FC493; --grass-d:#5FAE79; --dirt:#E7DAC0; --dirt-d:#D6C5A2;
  --gh:clamp(46px,11vh,112px); --hh:clamp(58px,15.5vh,156px); --oh:clamp(50px,13.5vh,136px); --fh:clamp(66px,18vh,172px); --r:16px;
  --font:"Yuanti SC","Yuanti TC","Yuanti","YouYuan","幼圆","幼圓","STYuanti","PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei","微軟雅黑",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); color:var(--ink); background:var(--soft);
  height:100vh; height:100dvh; overflow:hidden;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
.app{height:100%;max-width:1120px;margin:0 auto;padding:0 14px;display:flex;flex-direction:column}

/* ---------- header ---------- */
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:clamp(6px,1.5vh,12px) 2px clamp(5px,1.2vh,10px)}
.brand{display:flex;align-items:center;gap:8px;font-size:clamp(15px,3.1vh,19px);font-weight:700;letter-spacing:.5px}
.brand .logo{width:clamp(22px,4.2vh,28px);height:clamp(22px,4.2vh,28px);flex:0 0 auto}
.hud{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:clamp(4px,1vh,6px) clamp(9px,1.7vh,12px);font-size:clamp(12px,2.3vh,14px);font-weight:700;color:var(--ink)}
.chip small{color:var(--ink2);font-weight:400;font-size:12px}
.chip b{color:var(--blue);font-size:clamp(13px,2.6vh,16px)}
.mbtn{flex:0 0 auto;width:clamp(30px,5.6vh,38px);height:clamp(30px,5.6vh,38px);border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(0,0,0,.05);transition:transform .1s,background .15s,opacity .15s}
.mbtn:hover{background:var(--soft)}
.mbtn:active{transform:translateY(1px)}
.mbtn.off{opacity:.5;background:var(--soft)}

/* ---------- stage ---------- */
.stage{flex:1 1 auto;min-height:0;position:relative}
.scene{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,#F6FBFE 100%);border:1px solid var(--line)}
.scene.shake{animation:shakek .42s ease-out}
@keyframes shakek{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}65%{transform:translateX(3px)}85%{transform:translateX(-2px)}}
.sun{position:absolute;right:12%;top:9%;width:clamp(74px,10vh,110px);height:clamp(74px,10vh,110px);border-radius:50%;background:radial-gradient(circle,#FFF6DC 0%,#FFE9AE 60%,rgba(255,233,174,0) 72%);animation:sunp 4.5s ease-in-out infinite}
@keyframes sunp{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.06);opacity:1}}
.cloud{position:absolute;opacity:.95}
.cloud i{display:block;position:absolute;background:#fff;border-radius:999px}
.c1{width:92px;height:30px;top:14%;left:-15%;animation:drift 46s linear infinite}
.c2{width:66px;height:22px;top:26%;left:-30%;animation:drift 62s linear infinite;animation-delay:-14s;opacity:.8}
.c3{width:110px;height:34px;top:7%;left:-50%;animation:drift 78s linear infinite;animation-delay:-40s;opacity:.72}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(160vw)}}
.hills{position:absolute;left:0;bottom:calc(var(--gh) - 6px);width:600%;height:66%;display:flex;will-change:transform}
.hills svg{flex:0 0 33.3333%;height:100%;display:block}
.world{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.ground{position:absolute;left:0;bottom:0;width:100%;height:var(--gh);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 3px,rgba(255,255,255,0) 3px 44px) 0 0/100% 11px no-repeat,
    linear-gradient(180deg,var(--grass) 0 11px,var(--grass-d) 11px 15px,var(--dirt) 15px 100%);
  border-top:3px solid #6BB681}
.ground:after{content:"";position:absolute;left:0;right:0;top:22px;bottom:0;
  background-image:radial-gradient(circle,rgba(180,158,116,.55) 1.6px,transparent 1.7px);background-size:22px 18px}
.ob{position:absolute;bottom:var(--gh);width:calc(var(--oh)*0.96);height:var(--oh);transform:translateX(-50%)}
.ob .art{position:absolute;left:0;bottom:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.ob .art svg{width:100%;height:100%;overflow:visible}
.ob.cur .art{animation:obw 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes obw{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-3px)}}
.ob.gone .art{animation:obbreak .5s ease-out forwards}
@keyframes obbreak{0%{transform:scale(1) rotate(0);opacity:1}35%{transform:scale(1.22) rotate(-8deg)}100%{transform:scale(.2) rotate(26deg) translateY(14px);opacity:0}}
.ob .bubble{position:absolute;left:50%;bottom:calc(100% + 16px);opacity:0;pointer-events:none;
  transform:translate(-50%,10px) scale(.6);
  background:#fff;border:2.5px solid #fff;border-radius:20px;padding:10px 22px 12px;text-align:center;
  box-shadow:0 10px 26px rgba(28,52,84,.16),0 2px 0 rgba(0,0,0,.03);white-space:nowrap}
.ob .bubble:after{content:"";position:absolute;left:50%;top:100%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;filter:drop-shadow(0 3px 2px rgba(28,52,84,.08))}
.ob.cur .bubble{opacity:1;transform:translate(-50%,0) scale(1);animation:popin .46s cubic-bezier(.18,1.5,.4,1) forwards}
@keyframes popin{0%{opacity:0;transform:translate(-50%,14px) scale(.55)}60%{opacity:1;transform:translate(-50%,-4px) scale(1.06)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.ob .bw{font-size:clamp(27px,min(8vw,9.4vh),64px);font-weight:700;line-height:1.16;letter-spacing:6px;text-indent:6px}
/* 拼音永遠存在於版面（高度 0、完全透明），因此氣泡寬度不會跳動；
   提示時只用 max-height / opacity / transform 順暢展開 */
.ob .bp{display:block;overflow:hidden;max-height:0;opacity:0;margin-top:0;
  transform:translateY(-7px);transform-origin:50% 0;
  font-family:inherit;font-style:normal;font-weight:700;
  font-size:clamp(20px,min(5.8vw,6.4vh),40px);line-height:1.25;color:#D2521A;letter-spacing:2px;
  background:rgba(255,241,228,0);border:2.5px solid rgba(255,201,143,0);border-radius:999px;padding:0 20px;
  box-shadow:none;will-change:max-height,opacity,transform;
  transition:max-height .38s cubic-bezier(.22,.9,.3,1),opacity .26s ease .05s,
    transform .44s cubic-bezier(.2,1.2,.35,1),margin-top .38s cubic-bezier(.22,.9,.3,1),
    padding .32s ease,background-color .3s ease,border-color .3s ease}
.ob.hint .bp{max-height:clamp(54px,12vh,92px);opacity:1;margin-top:clamp(6px,1.4vh,10px);transform:none;padding:6px 20px;
  background:#FFF1E4;border-color:#FFC98F;box-shadow:0 4px 12px rgba(226,98,27,.16);
  animation:bpGlow 2.6s ease-in-out .6s infinite}
@keyframes bpGlow{0%,100%{box-shadow:0 4px 12px rgba(226,98,27,.16)}50%{box-shadow:0 7px 20px rgba(226,98,27,.30)}}
.ob.cur.bad .bubble{animation:bshake .5s cubic-bezier(.25,.9,.3,1)}
@keyframes bshake{0%,100%{transform:translate(-50%,0) rotate(0)}22%{transform:translate(-50%,-2px) rotate(-1.4deg)}52%{transform:translate(-50%,0) rotate(1.4deg)}78%{transform:translate(-50%,0) rotate(-.6deg)}}
.tuft{position:absolute;bottom:calc(var(--gh) - 4px);width:22px;height:16px;transform-origin:50% 100%;animation:sway 2.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.tuft svg{width:100%;height:100%}
.flag{position:absolute;bottom:var(--gh);width:calc(var(--fh)*0.625);height:var(--fh);transform:translateX(-50%)}
.flag svg{width:100%;height:100%}

/* ---------- hero ---------- */
.hero{position:absolute;bottom:var(--gh);left:0;width:calc(var(--hh)*0.78);height:var(--hh);display:flex;align-items:flex-end;justify-content:center;will-change:transform;z-index:3}
.hero .mal{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 95%;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.hero .mal .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.hero .shadow{position:absolute;left:50%;bottom:1px;width:58%;height:10px;border-radius:50%;background:rgba(58,72,52,.20);transform:translateX(-50%);filter:blur(1.5px);z-index:-1}
.hero.run .shadow{animation:shk .46s ease-in-out infinite}
@keyframes shk{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.85}45%{transform:translateX(-50%) scaleX(.6);opacity:.4}}
@keyframes hopk{0%{transform:translateY(0) rotate(-9deg)}22%{transform:translateY(-15%) rotate(3deg)}50%{transform:translateY(-24%) rotate(11deg)}78%{transform:translateY(-7%) rotate(1deg)}100%{transform:translateY(0) rotate(-9deg)}}
@keyframes malsway{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-3px)}}
/* 揚槌→落槌敲碎路障（落槌點在 42%，約 260ms） */
@keyframes swingk{0%{transform:translate(0,0) rotate(-4deg)}18%{transform:translate(-3%,0) rotate(-48deg)}42%{transform:translate(9%,-3%) rotate(50deg)}54%{transform:translate(7%,0) rotate(43deg)}72%{transform:translate(2%,0) rotate(14deg)}100%{transform:translate(0,0) rotate(-4deg)}}
@keyframes cheerk{0%{transform:translateY(0) rotate(0)}28%{transform:translateY(-26px) rotate(-16deg)}56%{transform:translateY(0) rotate(0)}78%{transform:translateY(-10px) rotate(13deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes bobk{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.5px) scaleY(1.025)}}
@keyframes bumpk{0%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-4deg)}55%{transform:translateX(3px)}100%{transform:translateX(0)}}
@keyframes jumpk{0%{transform:translateY(0)}26%{transform:translateY(-30px) rotate(-4deg)}52%{transform:translateY(0)}72%{transform:translateY(-12px)}100%{transform:translateY(0)}}
.hero.swing{z-index:6}
.hero.idle .mal{animation:malsway 2.4s ease-in-out infinite}
.hero.run .mal{animation:hopk .46s ease-in-out infinite}
.hero.bump .mal{animation:bumpk .38s ease-out}
.hero.swing .mal{animation:swingk .62s cubic-bezier(.2,.85,.3,1)}
.hero.cheer .mal{animation:cheerk .9s ease-out}
.dust{position:absolute;left:2px;bottom:0;width:26px;height:14px;opacity:0}
.dust i{position:absolute;bottom:0;width:9px;height:9px;border-radius:50%;background:rgba(196,176,138,.75)}
.dust i:nth-child(1){left:0}.dust i:nth-child(2){left:9px;width:7px;height:7px}.dust i:nth-child(3){left:17px;width:6px;height:6px}
.hero.run .dust{animation:dustk .42s linear infinite}
@keyframes dustk{0%{opacity:.85;transform:translateX(0) scale(.6)}100%{opacity:0;transform:translateX(-24px) scale(1.25)}}

/* 棒槌敲擊星光 */
.hit{position:absolute;width:clamp(72px,15vw,132px);height:clamp(72px,15vw,132px);z-index:7;pointer-events:none;
  transform:translate(-50%,-50%);animation:hitk .5s ease-out forwards}
.hit svg{width:100%;height:100%}
@keyframes hitk{0%{transform:translate(-50%,-50%) scale(.25) rotate(-14deg);opacity:0}
  22%{opacity:1}60%{transform:translate(-50%,-50%) scale(1.02) rotate(6deg);opacity:.95}
  100%{transform:translate(-50%,-50%) scale(1.32) rotate(16deg);opacity:0}}

/* ---------- overlays in scene ---------- */
.dots{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5;
  background:rgba(255,255,255,.72);border-radius:999px;padding:7px 12px;backdrop-filter:blur(4px)}
.dot{width:10px;height:10px;border-radius:50%;background:#CFCEC9;transition:transform .25s,background .25s}
.dot.done{background:var(--green)}
.dot.now{background:var(--blue);transform:scale(1.5)}
.popup{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:8;pointer-events:none;
  font-size:clamp(26px,6vw,42px);font-weight:700;text-align:center;white-space:nowrap;
  padding:12px 30px;border-radius:999px;background:#fff;box-shadow:0 14px 34px rgba(28,52,84,.18)}
.popup.ok{color:var(--green)}
.popup.bad{color:var(--red)}
.popup.show{animation:popmsg 1.25s cubic-bezier(.16,1.5,.4,1) forwards}
@keyframes popmsg{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-78%) scale(.94)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.pc{position:absolute;width:9px;height:9px;border-radius:2px;animation:pck .85s ease-out forwards}
@keyframes pck{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(320deg) scale(.4)}}
.cf{position:absolute;top:-18px;width:10px;height:14px;border-radius:2px;animation:cfk 2.3s linear forwards}
@keyframes cfk{0%{opacity:1;transform:translateY(0) translateX(0) rotate(0)}
  100%{opacity:.92;transform:translateY(var(--fall,760px)) translateX(var(--dx2,0px)) rotate(560deg)}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:12;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:clamp(9px,2vh,18px)}
/* 結束畫面：永不出現滾動條，內容自動縮到剛好完整顯示 */
#screenDone{overflow:hidden;padding:12px 14px}
#screenStart{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 46%,#FBFEFF 100%)}
.stc{animation:cloudf 7s ease-in-out infinite !important;opacity:.9}
@keyframes cloudf{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.startInner{position:relative;z-index:2;width:100%;max-width:660px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;padding-bottom:clamp(14px,4vh,34px)}
.startArt{width:100%;max-width:460px;height:clamp(74px,16vh,140px);margin-bottom:4px}
.startArt svg{width:100%;height:100%;overflow:visible}
.startArt .fl{animation:floatk 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes floatk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.h1{font-size:clamp(19px,min(5.4vw,4.4vh),36px);font-weight:700;margin:clamp(3px,1vh,6px) 0 clamp(11px,3vh,22px);letter-spacing:2px;line-height:1.4}
.start{position:relative;border:0;cursor:pointer;font-family:inherit;color:#fff;font-weight:700;
  font-size:clamp(20px,min(5vw,4.2vh),31px);letter-spacing:4px;text-indent:4px;padding:clamp(13px,2.7vh,20px) clamp(38px,7vw,58px);border-radius:999px;
  background:linear-gradient(180deg,#FFC24A 0%,#FF9A2E 52%,#FF7A2F 100%);
  box-shadow:0 7px 0 #D9601A,0 16px 30px rgba(255,122,47,.36);
  animation:beat 2.1s ease-in-out infinite;transition:transform .12s,box-shadow .12s}
.start:hover{transform:translateY(-2px);box-shadow:0 9px 0 #D9601A,0 20px 34px rgba(255,122,47,.42)}
.start:active{transform:translateY(5px);box-shadow:0 2px 0 #D9601A,0 8px 16px rgba(255,122,47,.3);animation:none}
@keyframes beat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.025)}}
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:clamp(10px,2.6vh,22px);opacity:.62}
.steps span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.steps b{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
  background:var(--soft2);color:var(--ink2);font-size:10px;font-weight:700}
.envNote{margin-top:clamp(6px,1.6vh,12px);font-size:clamp(10.5px,2vh,12px);color:var(--ink2);min-height:clamp(12px,2.2vh,16px)}
#screenDone{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 46%,#FBFEFF 100%)}
#fx2{z-index:3}
.doneArt{position:relative;left:auto;bottom:auto;width:clamp(100px,15vh,152px);height:clamp(110px,16.5vh,168px);margin:0 auto 2px;z-index:1}
.doneArt svg{width:100%;height:100%;overflow:visible}
.doneArt.trophy .cup{animation:cheerBig 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 92%}
.doneArt.trophy .spk{animation:spkk 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.doneArt.trophy .spk2{animation-delay:.5s}
.doneArt.trophy .spk3{animation-delay:.95s}
.doneArt.mallet{width:clamp(94px,13.8vh,142px);height:clamp(120px,17.6vh,182px)}
.doneArt.mallet .malg{animation:malCheer 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 96%}
@keyframes malCheer{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-7px)}}
@keyframes spkk{0%,100%{opacity:.2;transform:scale(.55)}50%{opacity:1;transform:scale(1.2)}}
@keyframes cheerBig{0%{transform:translateY(0) rotate(-6deg) scale(1)}
  22%{transform:translateY(-26%) rotate(9deg) scale(1.06)}
  44%{transform:translateY(0) rotate(-7deg) scale(.98)}
  66%{transform:translateY(-16%) rotate(7deg) scale(1.04)}
  100%{transform:translateY(0) rotate(-6deg) scale(1)}}
.rays{position:absolute;left:50%;top:0;width:min(440px,94vw);height:min(440px,94vw);
  transform:translate(-50%,-28%);border-radius:50%;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,196,74,.34) 0deg 8deg,rgba(255,196,74,0) 8deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 26%,transparent 70%);mask:radial-gradient(circle,#000 26%,transparent 70%);
  animation:raysSpin 16s linear infinite,raysPulse 2.4s ease-in-out infinite}
@keyframes raysSpin{to{transform:translate(-50%,-28%) rotate(360deg)}}
@keyframes raysPulse{0%,100%{opacity:.5}50%{opacity:1}}
.emj{position:absolute;top:-9%;font-size:clamp(24px,5.4vw,40px);line-height:1;pointer-events:none;
  animation:emjFall 2.6s linear forwards;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
@keyframes emjFall{0%{opacity:0;transform:translateY(0) rotate(0) scale(.7)}
  10%{opacity:1;transform:translateY(7%) rotate(var(--r1,12deg)) scale(1.1)}
  100%{opacity:1;transform:translateY(var(--fall,760px)) rotate(var(--rot,40deg)) scale(1)}}
.doneInner{position:relative;z-index:2;width:100%;max-width:560px;text-align:center;padding-bottom:0;
  transform-origin:50% 50%;will-change:transform}
.doneTitle{position:relative;z-index:1;font-size:clamp(27px,min(7.4vw,6.2vh),50px);font-weight:700;margin:0 0 6px;letter-spacing:2px;
  animation:donePop .72s cubic-bezier(.16,1.7,.4,1) both, doneWave 2.5s ease-in-out .72s infinite}
@keyframes donePop{0%{opacity:0;transform:scale(.45) rotate(-10deg)}62%{opacity:1;transform:scale(1.16) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes doneWave{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-8px) rotate(1.4deg)}}
@keyframes statPop{0%{opacity:0;transform:translateY(18px) scale(.86)}100%{opacity:1;transform:translateY(0) scale(1)}}
.doneSub{position:relative;z-index:1;color:var(--ink2);font-size:clamp(12.5px,1.7vh,14px);line-height:1.5;
  margin-bottom:clamp(9px,2vh,18px);animation:statPop .5s ease-out .5s both}
.stats{position:relative;z-index:1;display:flex;gap:10px;justify-content:center;margin-bottom:clamp(9px,1.8vh,16px)}

/* ============ 元素 ============ */
function $(id){ return document.getElementById(id); }
var scene=$("scene"), world=$("world"), hills=$("hills"), hero=$("hero"), dots=$("dots"),
    popup=$("popup"), fx=$("fx"), hud=$("hud"), hudLevel=$("hudLevel"), hudTime=$("hudTime"),
    controls=$("controls"), statusEl=$("status"), heardEl=$("heard"),
    btnMic=$("btnMic"), micLabel=$("micLabel"), btnDemo=$("btnDemo"), btnSkip=$("btnSkip"), btnMusic=$("btnMusic"),

var ROUND=10;
var S={ words:[], els:[], idx:0, tries:0, wordTries:0, firstTry:0, misses:[], skips:0,
         t0:0, timer:null, state:"idle", heroX:0, camX:0, step:300, gap:150, x0:60, playing:false };

/* ============ 版面計算 ============ */
function metrics(){
  var w=scene.clientWidth||360;
  var hw=hero.offsetWidth||90;
  var ow=(S.els[0]&&S.els[0].offsetWidth)||Math.round(hw*0.86);
  S.x0   = Math.round(w*0.14);
  /* 小人以左邊定位，路障以中心定位：留出半個路障 + 一個小人的距離才不會疊在一起 */
  S.stand= Math.round(ow/2 + hw + 10);
  S.step = Math.max(Math.round(S.stand + ow*0.7 + 40), Math.min(460, Math.round(w*0.62)));
  S.gap  = Math.max(S.stand + Math.round(w*0.20), Math.round(w*0.34));
}
function obX(i){ return S.x0 + S.gap + i*S.step; }
function camFor(i){ return Math.max(0, obX(i) - Math.round(scene.clientWidth*0.60)); }
function heroFor(i){ return obX(i) - S.stand; }
function applyTransforms(dur){
  var t = dur ? "transform "+dur+"s linear" : "none";
  hero.style.transition=t; world.style.transition=t; hills.style.transition=t;
  hero.style.transform ="translateX("+(S.heroX-S.camX)+"px)";
  world.style.transform="translateX("+(-S.camX)+"px)";
  hills.style.transform="translateX("+(-S.camX*0.34)+"px)";
}

/* ============ 建場景 ============ */
function build(){
  metrics();
  var html='<div class="ground"></div>';
  for(var i=0;i<S.words.length;i++){
    html+='<div class="ob" data-i="'+i+'" style="left:'+obX(i)+'px">'
        + '<div class="bubble"><div class="bw">'+S.words[i].t+'</div><div class="bp">'+S.words[i].p+'</div></div>'
        + '<div class="art">'+OB[i%OB.length]+'</div></div>';
  }
  var endX=obX(S.words.length-1)+Math.round(S.step*0.62);
  for(var g=1;g<endX+1200;g+=Math.round(90+Math.random()*70)){
    html+='<div class="tuft" style="left:'+g+'px;animation-delay:-'+(g%28)/10+'s">'+TUFT+'</div>';
  }
  html+='<div class="flag" style="left:'+endX+'px">'+FLAG+'</div>';
  world.style.width=(obX(S.words.length-1)+S.step*1.4)+"px";
  world.innerHTML=html;
  S.els=[].slice.call(world.querySelectorAll(".ob"));
  /* 元素進 DOM 後才量得到真實寬度，重算一次版面 */
  metrics();
  for(var k=0;k<S.els.length;k++) S.els[k].style.left=obX(k)+"px";
  var fg=world.querySelector(".flag");
  if(fg) fg.style.left=(obX(S.words.length-1)+Math.round(S.step*0.62))+"px";
  world.style.width=(obX(S.words.length-1)+S.step*1.4)+"px";
  S.heroX=S.x0; S.camX=0; applyTransforms(0);
  renderDots();
}
function renderDots(){
  var h="";
  for(var i=0;i<S.words.length;i++){
    h+='<span class="dot'+(i<S.idx?" done":(i===S.idx?" now":""))+'"></span>';
  }
  dots.innerHTML=h;
  hudLevel.textContent=Math.min(S.idx+1,ROUND);
}

/* ============ 特效 ============ */
var COLORS=["#FFCE5C","#FF8A3D","#7FC493","#7FB8F0","#FF6F91","#B9E3F6"];
function burst(el){
  if(!el) return;
  var r=el.getBoundingClientRect(), s=scene.getBoundingClientRect();
  var cx=r.left-s.left+r.width/2, cy=r.top-s.top+r.height/2;
  for(var i=0;i<16;i++){
    var d=document.createElement("i"); d.className="pc";
    var a=Math.random()*Math.PI*2, dist=45+Math.random()*85;
    d.style.left=cx+"px"; d.style.top=cy+"px";
    d.style.background=COLORS[i%COLORS.length];
    d.style.setProperty("--dx",(Math.cos(a)*dist).toFixed(1)+"px");
    d.style.setProperty("--dy",(Math.sin(a)*dist-28).toFixed(1)+"px");
    d.style.animationDelay=(Math.random()*90).toFixed(0)+"ms";
    fx.appendChild(d);
    (function(n){ setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },1000); })(d);
  }
}
/* 棒槌落下的敲擊星光 */
function impact(el){
  if(!el) return;
  var r=el.getBoundingClientRect(), s=scene.getBoundingClientRect();
  var d=document.createElement("div"); d.className="hit";
  d.style.left=(r.left-s.left+r.width*0.20)+"px";
  d.style.top=(r.top-s.top+r.height*0.40)+"px";
  d.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2 58.5 33 84 12 68 42 98 50 68 58 84 88 58.5 67 50 98 41.5 67 16 88 32 58 2 50 32 42 16 12 41.5 33z" fill="#FFF3C4" stroke="#FFC24A" stroke-width="3.5" stroke-linejoin="round"/></svg>';
  fx.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },560);
}
function confetti(layer){
  var host=layer||fx;
  var fall=(host.clientHeight||620)+90;   /* 由上方一路飄落到畫面底部 */
  for(var i=0;i<74;i++){
    var d=document.createElement("i"); d.className="cf";
    d.style.left=(Math.random()*100)+"%";
    d.style.setProperty("--fall",fall+"px");
    d.style.setProperty("--dx2",(Math.random()*80-40).toFixed(0)+"px");
    d.style.background=COLORS[i%COLORS.length];
    var wd=6+Math.random()*8;
    d.style.width=wd.toFixed(1)+"px";
    d.style.height=(wd*(0.8+Math.random()*1.1)).toFixed(1)+"px";
    if(Math.random()<0.34) d.style.borderRadius="50%";
    d.style.animationDuration=(1.7+Math.random()*1.5).toFixed(2)+"s";
    d.style.animationDelay=(Math.random()*.7).toFixed(2)+"s";

    (function(n){ setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },4600); })(d);

}
var popT=null;
function popMsg(text,kind){
  popup.textContent=text;
  popup.className="popup "+(kind||"");
  void popup.offsetWidth;
  popup.classList.add("show");
  clearTimeout(popT);
  popT=setTimeout(function(){ popup.classList.remove("show"); },1300);
}
function setStatus(t,k){ statusEl.textContent=t; statusEl.className="status "+(k||""); }
function fmt(ms){
  var s=Math.max(0,Math.round(ms/1000));
  return ("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2);
}
function tick(){ hudTime.textContent=fmt(Date.now()-S.t0); }

/* ============ 流程 ============ */
function pickWords(){
  var a=BANK.slice(), out=[];
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  for(var k=0;k<ROUND && k<a.length;k++) out.push(a[k]);
  return out;
}
function cur(){ return S.els[S.idx]; }
function curWord(){ return S.words[S.idx]; }

function runToCurrent(){
  S.state="run";
  btnMic.disabled=true; micLabel.textContent="前進中";
  setStatus("衝向下一個路障…","live");
  heardEl.textContent=""; btnSkip.hidden=true;
  var tx=heroFor(S.idx), cx=camFor(S.idx);
  var dist=Math.abs(tx-S.heroX);
  var dur=Math.max(.55,Math.min(1.7,dist/300));
  hero.classList.remove("idle","cheer"); hero.classList.add("run");
  S.heroX=tx; S.camX=cx;
  requestAnimationFrame(function(){ applyTransforms(dur); });
  setTimeout(function(){
    hero.classList.remove("run"); hero.classList.add("idle","bump");
    setTimeout(function(){ hero.classList.remove("bump"); },400);
    promptWord();
  }, dur*1000+60);
}
function promptWord(){
  S.state="prompt"; S.wordTries=0;
  var el=cur(); if(!el) return;
  el.classList.add("cur"); el.classList.remove("hint","bad");
  renderDots();
  btnMic.disabled=false; micLabel.textContent="朗讀";
  setStatus("輪到你了！大聲讀出這個詞語");
}
function success(){
  if(S.state==="ok") return;
  S.state="ok";
  var el=cur();
  btnMic.disabled=true; micLabel.textContent="很好";
  btnSkip.hidden=true;
  if(S.wordTries<=1) S.firstTry++;
  setStatus("讀準了！揚槌敲碎路障！","ok");
  sfxOk();
  /* 先揚棒槌，落槌那一刻才敲碎路障 */
  hero.classList.remove("idle","cheer","bump"); void hero.offsetWidth; hero.classList.add("swing");
  setTimeout(function(){
    popMsg("念得真好！","ok");
    sfxHit();
    impact(el); burst(el);
    if(el){ el.classList.add("gone"); el.classList.remove("cur","hint","bad"); }
    scene.classList.remove("shake"); void scene.offsetWidth; scene.classList.add("shake");
    setTimeout(function(){ scene.classList.remove("shake"); },440);
  },255);
  setTimeout(function(){ hero.classList.remove("swing"); hero.classList.add("cheer"); },640);
  setTimeout(function(){ hero.classList.remove("cheer"); hero.classList.add("idle"); },1560);
  setTimeout(function(){
    S.idx++;
    if(S.idx>=S.words.length) finish();
    else runToCurrent();
  },1500);
}
function miss(text,why){
  S.state="prompt";
  var el=cur();
  /* 先輕晃一下，再讓拼音順暢展開，兩段動畫不重疊 */
  if(el){
    el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad");
    setTimeout(function(){ if(el===cur()) el.classList.add("hint"); },190);
  }
  S.misses.push(curWord());
  scene.classList.remove("shake"); void scene.offsetWidth; scene.classList.add("shake");
  setTimeout(function(){ scene.classList.remove("shake"); },460);
  hero.classList.remove("bump"); void hero.offsetWidth; hero.classList.add("bump");
  setTimeout(function(){ hero.classList.remove("bump"); },420);
  sfxBad();
  popMsg("再試試看！","bad");
  setStatus(why || "再試試看！照著拼音再讀一次","bad");
  heardEl.textContent = text ? "聽到："+text+dbgTail : "";
  btnMic.disabled=false; micLabel.textContent="再讀";
  if(S.wordTries>=3) btnSkip.hidden=false;   /* 讀滿三次都不對，才出現「放棄此關」 */
}
/* 結束畫面自動縮放：小畫面也能一眼看完，不需要右側滾動條 */
function fitDone(){
  if(!doneInner || !screenDone) return;
  doneInner.style.transform="none";
  requestAnimationFrame(function(){
    var availH=screenDone.clientHeight-24, availW=screenDone.clientWidth-28;
    var needH=doneInner.scrollHeight, needW=doneInner.scrollWidth;
    if(needH<=0 || availH<=0) return;
    var k=Math.min(1, availH/needH, availW/Math.max(1,needW));
    doneInner.style.transform = (k<0.995) ? "scale("+Math.max(0.5,k).toFixed(3)+")" : "none";
  });
}
function finish(){
  S.state="done"; S.playing=false;
  musDuck(false);
  clearInterval(S.timer);
  var used=Date.now()-S.t0;
  scene.hidden=true; controls.hidden=true; hud.hidden=true;
  screenDone.hidden=false;
  stTime.textContent=fmt(used);
  stFirst.textContent=S.firstTry+" / "+S.words.length;
  stTries.textContent=S.tries;
  if(S.skips>0){
    doneTitle.textContent="💪 只差一點點";
    doneSub.textContent="你破除了 "+(S.words.length-S.skips)+" 個路障，放棄了 "+S.skips+" 個，用時 "+fmt(used)+"。再來一次，一定可以全部讀準！";
  }else{
    doneTitle.textContent="🎉 恭喜通關！";
    doneSub.textContent="你破除了 "+S.words.length+" 個路障，用時 "+fmt(used)+"。";
  }
  var uniq=[], seen={};
  S.misses.forEach(function(w){ if(!seen[w.t]){ seen[w.t]=1; uniq.push(w); } });
  if(uniq.length){
    review.hidden=false;
    reviewList.innerHTML=uniq.map(function(w){ return "<li>"+w.t+"<i>"+w.p+"</i></li>"; }).join("");
  } else { review.hidden=true; }
  doneArt.className="doneArt "+(S.skips>0?"mallet":"trophy");
  doneArt.innerHTML=(S.skips>0?MALLET:TROPHY);
  fx2.innerHTML=""; party();
  fitDone();
}

/* ============ 麥克風（不錄音） ============
   麥克風串流只即時用於語音識別與聲調分析，全程不建立錄音檔、不保存任何音檔 */
var IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var mediaStream=null;
var micReady=false, micDenied=false, micAsked=false;   /* micAsked：整個頁面只向瀏覽器索取一次麥克風 */

function getStream(){
  if(mediaStream && mediaStream.active) return Promise.resolve(mediaStream);
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error("unsupported"));
  if(micAsked) return Promise.reject(new Error("already-asked"));   /* 問過一次就不再詢問 */
  micAsked=true;
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})
    .then(function(st){ mediaStream=st; return st; });
}
function releaseMic(){
  if(mediaStream){ try{ mediaStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} mediaStream=null; }
  micReady=false;
}
/* 整場遊戲只在開場時要一次麥克風權限，之後不再釋放、不再詢問 */
function primeMic(){
  if(mediaStream && mediaStream.active){ micReady=true; return Promise.resolve(true); }
  if(micAsked) return Promise.resolve(micReady);   /* 已經問過，沒拿到也不再問 */
  return getStream().then(function(){ micReady=true; micDenied=false; return true; })
                    .catch(function(){ micDenied=true; return false; });
}

/* ============ 語音識別 ============ */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null, best="", listening=false, recStart=0, endTimer=null, retried=false, netFail=0;
var altHit=false;   /* 目標詞只出現在次選結果：發音接近但不夠準 */
var finalTx="", interimTx="", conf=0;
var DEBUG=/[?&]debug=1/.test((location.search||"")), dbgTail="";

function norm(s){ return (s||"").replace(/[\s，。、！？,.!?~·…—\-'"“”‘’()（）【】\[\]]/g,""); }
function lcs(a,b){
  var m=a.length,n=b.length; if(!m||!n) return 0;
  var prev=new Array(n+1).fill(0), cw;
  for(var i=1;i<=m;i++){ cw=new Array(n+1).fill(0);
    for(var j=1;j<=n;j++){ cw[j]= a[i-1]===b[j-1] ? prev[j-1]+1 : Math.max(prev[j],cw[j-1]); }
    prev=cw;
  }
  return prev[n];
}
/* 判分（以整個詞為單位）：必須完整讀出該詞，
   但容許尾巴的語氣助詞（例如「幸福的」），避免讀對卻被判錯 */
var FILLER="了啊呀吧嗯的是哦噢喔嘛呢麼么欸誡呃哎唉噓";
function trimFiller(g){
  var x=g;
  while(x.length>1 && FILLER.indexOf(x.charAt(x.length-1))>=0) x=x.slice(0,-1);
  while(x.length>1 && FILLER.indexOf(x.charAt(0))>=0) x=x.slice(1);
  return x;
}
function score(text){
  var w=curWord(); if(!w) return 0;
  var g0=norm(text); if(!g0) return 0;
  var t=norm(w.t), s=norm(w.s), i, g;
  var cands=[g0, trimFiller(g0)];
  for(i=0;i<cands.length;i++){
    g=cands[i]; if(!g) continue;
    if(g===t || g===s) return 1;
    if(g===t+t || g===s+s || g===t+s || g===s+t) return 1;
  }
  var r=Math.max(lcs(g0,t)/t.length, lcs(g0,s)/s.length);
  return Math.min(r,0.9);
}
function listen(){
  if(S.state!=="prompt" || !S.playing) return;
  if(listening) return;
  if(!SR){ noAsr(); return; }
  listening=true; retried=false; best=""; finalTx=""; interimTx=""; conf=0;
  S.state="listen"; S.tries++; S.wordTries++;
  try{ var _sy=ttsSynth(); if(_sy) _sy.cancel(); }catch(e){}   /* 停掉示範，不讓它被麥克風收進去 */
  micGate(false);                                             /* 確保麥克風軌是開的 */
  musDuck(true);                                              /* 聜聽時背景音樂完全靜音 */
  btnMic.classList.add("on"); micLabel.textContent="聆聽中";
  setStatus("聆聽中…請清楚讀出詞語","live");
  heardEl.textContent="";
  startASR();
}
function startASR(){
  /* 重複使用同一個識別器：每次 new SpeechRecognition 都可能讓瀏覽器再問一次權限 */
  if(!rec){
    rec=new SR();
    rec.lang="zh-CN"; rec.continuous=false; rec.interimResults=true;
    rec.maxAlternatives=5;   /* 取多個候選，只用來分辨「接近但不夠準」 */
  }
  finalTx=""; interimTx=""; conf=0; altHit=false;
  recStart=Date.now();
  pitchStart();   /* 同步記錄音高，用來檢查聲調 */
  rec.onresult=function(ev){
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var r=ev.results[i], k, alt;
      var tx=(r[0]&&r[0].transcript||"").trim();
      /* 嚴格判分：只認識別引擎的首選結果；
         目標詞只出現在次選，代表發音接近但不夠準 */
      for(k=1;k<r.length;k++){
        alt=((r[k]&&r[k].transcript)||"").trim();
        if(alt && score(alt)>=1){ altHit=true; break; }
      }
      if(!tx) continue;
      if(r.isFinal){
        finalTx+=tx;
        if(typeof r[0].confidence==="number" && r[0].confidence>0) conf=r[0].confidence;
      }else{
        interimTx=tx;
      }
    }
    best=finalTx||interimTx||"";
    if(best) heardEl.textContent="聽到："+best;
    if(finalTx && score(finalTx)>=1) stopASR();   /* 確定讀準才提前結束 */
  };
  rec.onerror=function(ev){ asrError((ev&&ev.error)||"unknown"); };
  rec.onend=function(){ if(listening) endListen(); };
  try{ rec.start(); }
  catch(e){ setTimeout(function(){ try{ rec.start(); }catch(e2){ asrError("start-failed"); } },320); }
  clearTimeout(endTimer);
  endTimer=setTimeout(function(){ stopASR(); },7000);
}
function stopASR(){ try{ if(rec) rec.stop(); }catch(e){} }
function asrError(code){
  if(!listening) return;
  var quick=(Date.now()-recStart)<1800;
  /* 常見情況：邊錄音邊識別搶麥（iOS/部分 Android）→ 靜默改為只識別後重試，不向玩家報錯 */
  if(!retried && quick && (code==="aborted"||code==="audio-capture"||code==="start-failed")){
    retried=true;
    setTimeout(function(){ if(listening) startASR(); },380);
    return;
  }
  if(code==="no-speech"){ endListen(); return; }
  listening=false; clearTimeout(endTimer); pitchStop();
  musDuck(false);
  btnMic.classList.remove("on");
  S.state="prompt"; btnMic.disabled=false; micLabel.textContent="再讀";
  if(code==="not-allowed"||code==="service-not-allowed"){
    setStatus("請允許瀏覽器使用麥克風，再點「朗讀」","bad");
  }else if(code==="network"){
    netFail++;
    setStatus("網絡未連上語音識別服務，請檢查網絡","bad");
    if(netFail>=2 && S.wordTries>=3) btnSkip.hidden=false;
  }else{
    setStatus("沒聽清楚，再讀一次","bad");
  }
}
function endListen(){
  if(!listening) return;
  if(!norm(best) && (Date.now()-recStart)<1400 && !retried){
    /* 部分裝置首次啟動識別會立刻結束且沒有結果，這裡靜默重試一次 */
    retried=true;
    setTimeout(function(){ if(listening) startASR(); },380);
    return;
  }
  listening=false; clearTimeout(endTimer);
  pitchStop();
  musDuck(false);
  btnMic.classList.remove("on");
  var text=best;
  if(!norm(text)){
    S.state="prompt"; btnMic.disabled=false; micLabel.textContent="再讀";
    setStatus("沒聽到聲音，靠近麥克風再讀一次","bad");
    return;
  }
  var v=judge(text, conf);
  dbgTail = DEBUG ? "  ["+((v.tn&&v.tn.dbg)||"-")+" cf="+(conf?conf.toFixed(2):"-")+" "+v.reason+"]" : "";
  heardEl.textContent="聽到："+text+dbgTail;
  if(v.pass) success();
  else miss(text, v.why);
}
/* 整體發音判定（以實測証據為準）：
   字音對了之後，只有「量到明確錯誤」或「信心值極低」才不給過 */
function judge(text, cf){
  var w=curWord(), py=(w?w.p:"");
  var sc=Math.max(score(text), score(finalTx), score(interimTx));
  var tn=toneCheck();
  if(sc<1) return {pass:false, reason:"word", tn:tn,
    why:(altHit ? "有點接近，但還不夠準！照「"+py+"」再讀一次" : null)};
  if(tn.verdict==="flat") return {pass:false, reason:"canto", tn:tn,
    why:"聽起來不是普通話聲調，請用普通話照「"+py+"」讀一次"};
  if(tn.verdict==="wrong") return {pass:false, reason:"tone", tn:tn,
    why:"第 "+(tn.at||1)+" 個字的聲調不對，照「"+py+"」再讀一次"};
  if(cf>0 && cf<0.30) return {pass:false, reason:"unclear", tn:tn,
    why:"讀音不夠清楚，靳近麥克風再讀一次"};
  if(tn.why==="no-data" && cf>0 && cf<0.45) return {pass:false, reason:"unclear2", tn:tn,
    why:"讀音不夠清楚，靳近麥克風再讀一次"};
  return {pass:true, why:null, reason:"ok", tn:tn};
}
function noAsr(){
  setStatus("此瀏覽器不支援 AI 語音識別，請改用 Chrome 或 Safari","bad");
  btnSkip.hidden=false;
}

/* ============ 提示音（Web Audio，不需外部音檔） ============ */
var AC=null;
function actx(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    if(!AC) AC=new C();
    if(AC.state==="suspended" && AC.resume) AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq,at,dur,type,vol){
  var ac=actx(); if(!ac) return;
  try{
    var o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine";
    var t0=ac.currentTime+at;
    o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+dur+0.04);
  }catch(e){}
}
function sfxOk(){    /* 讀準：明亮上行三音 */
  tone(659.25,0,0.14,"triangle",0.18);
  tone(880.00,0.10,0.15,"triangle",0.18);
  tone(1318.5,0.21,0.26,"triangle",0.14);
}
function sfxHit(){   /* 敲碎路障：低沉一擊 */
  tone(150,0,0.12,"square",0.15);
  tone(90,0.02,0.20,"sine",0.20);
}
function sfxBad(){   /* 讀錯：柔和下行兩音 */
  tone(392.00,0,0.17,"triangle",0.15);
  tone(261.63,0.15,0.30,"triangle",0.15);
}

/* ============ 背景音樂（Web Audio 即時合成，不需外部音檔） ============
   • 輕快的五聲音階循環，音量很低，不會蓋過人聲
   • 聜聽或播示範時自動靜音，不會干擾語音識別
   • 右上角 🎵 可隨時開關，選擇會記住 */
var MUS={on:true, started:false, gain:null, timer:null, step:0, next:0, duck:0, vol:0.07};
try{ MUS.on = (localStorage.getItem("pth_music") !== "0"); }catch(e){}
var MEL=[659.25,0,783.99,0,880.00,0,783.99,0, 659.25,0,587.33,0,523.25,0,0,0,
         587.33,0,659.25,0,783.99,0,659.25,0, 587.33,0,523.25,0,440.00,0,0,0];
var BAS=[130.81,0,0,0,196.00,0,0,0, 174.61,0,0,0,196.00,0,0,0,
         146.83,0,0,0,196.00,0,0,0, 130.81,0,0,0,196.00,0,0,0];
var MSTEP=0.2727;   /* 110 BPM 的八分音符 */
function musGain(){
  var ac=actx(); if(!ac) return null;
  if(!MUS.gain){ MUS.gain=ac.createGain(); MUS.gain.gain.value=0; MUS.gain.connect(ac.destination); }
  return MUS.gain;
}
function musTarget(){ return (MUS.on && !MUS.duck) ? MUS.vol : 0; }
function musApply(){
  var ac=actx(), g=musGain(); if(!ac||!g) return;
  try{ g.gain.setTargetAtTime(musTarget(), ac.currentTime, 0.14); }
  catch(e){ try{ g.gain.value=musTarget(); }catch(e2){} }
}
function musVoice(f,at,dur,type,v){
  var ac=AC, g=MUS.gain; if(!ac||!g) return;
  try{
    var o=ac.createOscillator(), e=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f,at);
    e.gain.setValueAtTime(0.0001,at);
    e.gain.exponentialRampToValueAtTime(v,at+0.03);
    e.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(e); e.connect(g);

  }catch(err){}

function musTick(){
  var ac=actx(); if(!ac||!MUS.gain) return;
  if(MUS.next < ac.currentTime) MUS.next=ac.currentTime+0.05;
  while(MUS.next < ac.currentTime+0.40){
    var i=MUS.step%MEL.length;
    if(MEL[i]) musVoice(MEL[i],MUS.next,0.42,"triangle",0.16);
    if(BAS[i]) musVoice(BAS[i],MUS.next,0.80,"sine",0.20);
    MUS.next+=MSTEP; MUS.step++;
  }
}
function musStart(){
  var ac=actx(); if(!ac) return;
  musGain(); MUS.started=true; musApply();
  if(MUS.timer) return;
  MUS.next=ac.currentTime+0.12;
  MUS.timer=setInterval(musTick,120);
  musTick();
}
function musStop(){
  clearInterval(MUS.timer); MUS.timer=null;
  if(MUS.gain){ try{ MUS.gain.gain.value=0; }catch(e){} }
}
function musDuck(on){ MUS.duck=on?1:0; musApply(); }
function musIcon(){
  if(!btnMusic) return;
  btnMusic.textContent = MUS.on ? "🎵" : "🔇";
  btnMusic.title = MUS.on ? "關閉背景音樂" : "開啟背景音樂";
  if(MUS.on) btnMusic.classList.remove("off"); else btnMusic.classList.add("off");
}
function musToggle(){
  MUS.on=!MUS.on;
  try{ localStorage.setItem("pth_music", MUS.on?"1":"0"); }catch(e){}
  if(MUS.on) musStart();
  else { musApply(); setTimeout(musStop,420); }
  musIcon();
}

/* ============ 聲調檢查：抳「字對但不是普通話」（例如用廣東話念） ============ */
var TONE_ON=true, ana=null, anaSrc=null, anaBuf=null, pitchTimer=null, pitchTrack=[];
var TONE_MARK={1:"āēīōūǖ",2:"áéíóúǘ",3:"ǎěǐǒǔǚ",4:"àèìòùǜ"};
function toneOfSyl(s){
  for(var k=1;k<=4;k++){
    for(var i=0;i<s.length;i++){ if(TONE_MARK[k].indexOf(s.charAt(i))>=0) return k; }
  }
  return 0;   /* 輕聲或查不到：不檢查 */
}
function toneSeq(){
  var w=curWord(); if(!w||!w.p) return [];
  return w.p.trim().split(/\s+/).map(toneOfSyl);
}
function toneSetup(){
  if(ana) return true;
  if(!TONE_ON) return false;
  if(!mediaStream || !mediaStream.active) return false;
  var ac=actx(); if(!ac) return false;
  try{
    anaSrc=ac.createMediaStreamSource(mediaStream);
    ana=ac.createAnalyser(); ana.fftSize=2048; ana.smoothingTimeConstant=0;
    anaSrc.connect(ana);
    anaBuf=new Float32Array(ana.fftSize);
    return true;
  }catch(e){ ana=null; TONE_ON=false; return false; }
}
/* 自相關求基頸（人聲 70–400Hz） */
function pitchOf(buf,sr){
  var n=buf.length,i,rms=0;
  for(i=0;i<n;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/n);
  if(rms<0.010) return 0;
  var lo=Math.floor(sr/400), hi=Math.min(Math.floor(sr/70), n-4), bestLag=0, bestCor=0;
  for(var lag=lo;lag<=hi;lag++){
    var c=0, m=n-lag, cnt=0;
    for(i=0;i<m;i+=2){ c+=buf[i]*buf[i+lag]; cnt++; }
    c/=cnt;
    if(c>bestCor){ bestCor=c; bestLag=lag; }
  }
  if(!bestLag || bestCor < rms*rms*0.34) return 0;
  return sr/bestLag;
}
function pitchStart(){
  pitchTrack=[];
  if(!toneSetup()) return;
  clearInterval(pitchTimer);
  pitchTimer=setInterval(function(){
    try{ ana.getFloatTimeDomainData(anaBuf); pitchTrack.push(pitchOf(anaBuf, AC.sampleRate)); }catch(e){}
  },25);
}
function pitchStop(){ clearInterval(pitchTimer); pitchTimer=null; }
function semis(a,b){ return 12*Math.log(a/b)/Math.log(2); }
function voicedRuns(){
  var out=[], run=null, gap=0;
  for(var i=0;i<pitchTrack.length;i++){
    var f=pitchTrack[i];
    if(f>0){
      if(!run){ run=[]; out.push(run); }
      else if(gap===1 && run.length){ run.push((run[run.length-1]+f)/2); }   /* 補回一格短暫斷裂 */
      run.push(f); gap=0;
    }else{
      gap++;
      if(gap>1) run=null;   /* 連續兩格無聲才算分音節 */
    }
  }
  return out.filter(function(r){ return r.length>=3; });
}
/* 中值濾波：消除自相關偶發的倒八度跳變，避免聲調誤判 */
function med3(a){
  if(a.length<3) return a.slice();
  var o=a.slice();
  for(var i=1;i<a.length-1;i++){
    var t3=[a[i-1],a[i],a[i+1]].sort(function(x,y){ return x-y; });
    o[i]=t3[1];
  }
  return o;
}
/* ---- 聲調檢查（以實測証據為準）----
   字音已經完全對了之後，只有「明確量到的錯誤」才判不過：
     1) 該有調型的音節全部沒有起伏（粵語念法的典型特征）→ 判平調
     2) 明確量到方向相反（該升卻降、該降卻升）→ 判聲調錯
   量不到、太短、資料不足一律不扣分，避免「讀對卻不給過」。*/
function pctOf(a,p){
  var b=a.slice().sort(function(x,y){ return x-y; });
  if(!b.length) return 0;
  var i=Math.round((b.length-1)*p);
  if(i<0) i=0;
  if(i>b.length-1) i=b.length-1;
  return b[i];
}
function clamp01(x){ return x<0?0:(x>1?1:x); }
function avgOf(a,i0,i1){ var s=0,n=0; for(var i=i0;i<i1;i++){ s+=a[i]; n++; } return n?s/n:0; }

function cleanSyl(a){
  if(a.length<4) return a;
  var m=medOf(a); if(!m) return a;
  return a.filter(function(f){ return Math.abs(semis(f,m))<=7; });   /* 排除倍頻／半頻跳點 */
}
function wantTones(){
  var w=toneSeq(), out=[], i;
  for(i=0;i<w.length;i++) out.push((w[i]===3 && w[i+1]===3) ? 2 : w[i]);   /* 三聲變調 */
  return out;
}
function pickRuns(segs,n){
  if(segs.length<=n) return segs.slice();
  return segs.map(function(r,i){ return {i:i,r:r}; })
    .sort(function(a,b){ return b.r.length-a.r.length; }).slice(0,n)
    .sort(function(a,b){ return a.i-b.i; })
    .map(function(o){ return o.r; });
}
function toneCheck(){
  var want=wantTones(), i;
  var out={verdict:"pass", why:"pass", at:0, checked:0, total:0, need:0,
           frames:0, maxRange:0, flatN:0, contourN:0, dbg:""};
  for(i=0;i<want.length;i++) if(want[i]) out.total++;
  out.need=out.total;
  if(!ana || !out.total){ out.why="no-data"; return out; }
  var fr=0;
  for(i=0;i<pitchTrack.length;i++) if(pitchTrack[i]>0) fr++;
  out.frames=fr;
  if(fr<8){ out.why="no-data"; return out; }
  var segs=pickRuns(voicedRuns(), want.length);
  if(!segs.length){ out.why="no-data"; return out; }
  var dbg=[], firstFlat=0;
  for(i=0;i<segs.length && i<want.length;i++){

    var a=cleanSyl(med3(segs[i]));
    if(a.length<4) continue;
    out.checked++;
    var n=a.length, k=Math.max(1,Math.round(n*0.28));
    var head=avgOf(a,0,k), tail=avgOf(a,n-k,n);

    if(tone===2){

      flat=(slope<1.2 && rng<2.2);
      wrong=(n>=6 && rng>=2.2 && slope<=-2.2);
    }else if(tone===4){
      out.contourN++;
      flat=(slope>-1.2 && rng<2.2);
      wrong=(n>=6 && rng>=1.6 && slope>=1.4);
    }else if(tone===3){
      out.contourN++;
      flat=(dipv>-0.8 && Math.abs(slope)<1.5 && rng<2.2); var mi3=0,qq3; for(qq3=1;qq3<n;qq3++){ if(a[qq3]<a[mi3]) mi3=qq3; } var mp3=(n>1?mi3/(n-1):0), dip03=semis(a[mi3],a[0]); wrong=(n>=6 && rng>=1.6 && slope>=1.4 && mp3<0.30 && dip03>-0.8);
    }else if(tone===1){
      var mi1=0,qq1; for(qq1=1;qq1<n;qq1++){ if(a[qq1]<a[mi1]) mi1=qq1; }
      var mp1=(n>1?mi1/(n-1):0);
      wrong=(n>=6 && ((rng>=3.2 && slope>=3.0) || (rng>=3.6 && slope<=-3.4)
                   || (rng>=3.2 && dipv<=-2.6 && mp1>=0.2 && mp1<=0.85)));
    }
    if(tone!==1 && rng>out.maxRange) out.maxRange=rng;
    if(flat){ out.flatN++; if(!firstFlat) firstFlat=i+1; }
    dbg.push(tone+":s"+(slope>=0?"+":"")+slope.toFixed(1)+" r"+rng.toFixed(1));
    if(wrong && out.verdict==="pass"){ out.verdict="wrong"; out.why="tone"; out.at=i+1; }
  }
  out.dbg=dbg.join("|");
  if(!out.checked){ out.why="no-data"; return out; }
  if(out.verdict==="wrong") return out;
  if(out.contourN>=1 && out.flatN===out.contourN && out.maxRange<2.4){
    out.verdict="flat"; out.why="flat"; out.at=firstFlat||1;
  }
  return out;
}

/* ============ 示範發音（只用普通話語音，排除粵語） ============ */
var TTS={voices:[], picked:null, warmed:false, noVoice:false, timer:null};
function ttsSynth(){ try{ return ("speechSynthesis" in window) ? window.speechSynthesis : null; }catch(e){ return null; } }
function isCantoVoice(v){
  var s=((v.lang||"")+" "+(v.name||"")+" "+(v.voiceURI||""));
  return /yue|zh[-_]?hk|cantonese|粵|粤|廣東|广东|香港|sin[-_ ]?ji|善怡/i.test(s);
}
function voiceRank(v){
  var lang=(v.lang||"").replace(/_/g,"-"), name=((v.name||"")+" "+(v.voiceURI||""));
  if(isCantoVoice(v)) return -1;                       /* 粵語音色一律不用 */
  var isZh=/^(zh|cmn)(-|$)/i.test(lang) || /chinese|中文|普通话|普通話|國語|国语|mandarin/i.test(name);
  if(!isZh) return -1;
  var s=20;
  if(/^(zh|cmn)-(hans|cn)/i.test(lang)) s=100;         /* 大陸普通話：最優先 */
  else if(/^(zh|cmn)$/i.test(lang)) s=70;
  else if(/^(zh|cmn)-(hant|tw)/i.test(lang)) s=55;     /* 台灣國語：可接受的替代 */
  if(/mandarin|普通话|普通話|中国大陆|中國大陸|ting[-_ ]?ting|婷婷|xiaoxiao|yaoyao|huihui|kangkang|yunyang|mei[-_ ]?jia|美佳/i.test(name)) s+=12;
  if(/google/i.test(name)) s+=4;
  return s;
}
function ttsLoad(){
  var syn=ttsSynth(); if(!syn) return;
  try{ TTS.voices=syn.getVoices()||[]; }catch(e){ TTS.voices=[]; }
  var best=null, bs=0, i, r;
  for(i=0;i<TTS.voices.length;i++){
    r=voiceRank(TTS.voices[i]);
    if(r>bs){ bs=r; best=TTS.voices[i]; }
  }
  TTS.picked=best;
  TTS.noVoice=(TTS.voices.length>0 && !best);
}
function ttsInit(){
  var syn=ttsSynth(); if(!syn) return;
  ttsLoad();
  try{
    if(syn.addEventListener) syn.addEventListener("voiceschanged", ttsLoad);
    else syn.onvoiceschanged=ttsLoad;
  }catch(e){}
  var n=0;                                 /* 部分 Android／Windows 語音清單載入較慢 */
  TTS.timer=setInterval(function(){ ttsLoad(); if(TTS.picked || ++n>14) clearInterval(TTS.timer); },350);
}
function ttsWarm(){        /* 必須在使用者手勢裡跑一次，iOS／部分 Android 之後才發得出聲 */
  var syn=ttsSynth(); if(!syn || TTS.warmed) return;
  try{
    var u=new SpeechSynthesisUtterance(" ");
    u.volume=0; u.rate=1; u.lang="zh-CN";
    syn.speak(u);
    TTS.warmed=true;
  }catch(e){}
  ttsLoad();
}
/* 沒有普通話語音時的後備示範：直接用音高畫出每個字的調型 */
function glide(t,at,dur,base){
  var ac=actx(); if(!ac) return;
  try{
    var o=ac.createOscillator(), g=ac.createGain();
    var f=function(st){ return base*Math.pow(2, st/12); };
    o.type="triangle";
    if(t===2){ o.frequency.setValueAtTime(f(1),at); o.frequency.linearRampToValueAtTime(f(8),at+dur); }
    else if(t===3){ o.frequency.setValueAtTime(f(0),at); o.frequency.linearRampToValueAtTime(f(-5),at+dur*0.45); o.frequency.linearRampToValueAtTime(f(3),at+dur); }
    else if(t===4){ o.frequency.setValueAtTime(f(9),at); o.frequency.linearRampToValueAtTime(f(-3),at+dur); }
    else { o.frequency.setValueAtTime(f(7),at); o.frequency.linearRampToValueAtTime(f(6.6),at+dur); }
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(0.16,at+0.04);
    g.gain.setValueAtTime(0.16,at+Math.max(0.08,dur-0.10));
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(at); o.stop(at+dur+0.05);
  }catch(e){}
}
function toneDemo(){
  var seq=toneSeq(); if(!seq.length) return false;
  var ac=actx(); if(!ac) return false;
  var t0=ac.currentTime+0.06;
  for(var i=0;i<seq.length;i++) glide(seq[i]||1, t0+i*0.60, 0.48, 220);
  return true;
}
function demoFallback(msg){
  var ok=toneDemo();
  setStatus(ok ? (msg+"（聽調型：1 平、2 升、3 降升、4 降）")
               : "示範暫時無法播放，請照拼音跟讀", "bad");
  var el=cur(); if(el) el.classList.add("hint");       /* 同時直接顯示拼音 */
}
function micGate(off){     /* 播示範時暫時關掉麥克風收音，避免回授與誤判 */
  if(!mediaStream) return;
  try{ mediaStream.getAudioTracks().forEach(function(t){ t.enabled=!off; }); }catch(e){}
}
var demoBusy=false;
function speak(){
  var w=curWord(); if(!w) return;
  if(listening || demoBusy) return;                    /* 聜聽中不播示範 */
  var syn=ttsSynth();
  if(!syn){ demoFallback("此瀏覽器不支援語音示範"); return; }
  if(!TTS.voices.length || !TTS.picked) ttsLoad();
  if(!TTS.picked){ demoFallback("此裝置沒有普通話語音，已改用聲調示範"); return; }
  var v=TTS.picked;
  try{ syn.cancel(); }catch(e){}
  try{ if(syn.paused && syn.resume) syn.resume(); }catch(e){}
  var u=new SpeechSynthesisUtterance(w.s||w.t);
  u.voice=v; u.lang=(v && v.lang) ? v.lang : "zh-CN";
  u.rate=(IS_IOS?0.82:0.78); u.pitch=1.02; u.volume=1;
  var started=false, done=false, guard=null, hard=null;
  function release(restore){
    if(done) return;
    done=true;
    clearTimeout(guard); clearTimeout(hard);
    demoBusy=false; micGate(false); musDuck(false);
    if(restore && S.state==="prompt") setStatus("輪到你了！大聲讀出這個詞語");
  }
  u.onstart=function(){ started=true; clearTimeout(guard); };
  u.onend=function(){ release(true); };
  u.onerror=function(){ release(false); demoFallback("示範播不出聲，已改用聲調示範"); };
  demoBusy=true; micGate(true); musDuck(true);
  setStatus("示範發音…請仔細聽","live");
  try{ syn.speak(u); }
  catch(e){ release(false); demoFallback("示範播不出聲，已改用聲調示範"); return; }
  guard=setTimeout(function(){                         /* 沒有開始出聲：改用後備示範 */
    if(started) return;
    try{ syn.cancel(); }catch(e){}
    release(false);
    demoFallback("示範播不出聲，已改用聲調示範");
  },1400);
  hard=setTimeout(function(){ release(true); },8000);  /* 保險：onend 沒回來也要解鎖 */
}
btnDemo.addEventListener("click",speak);
btnMic.addEventListener("click",function(){ actx(); listen(); });
btnSkip.addEventListener("click",function(){
  if(S.state==="ok"||S.state==="done") return;
  if(listening){ listening=false; stopASR(); pitchStop(); btnMic.classList.remove("on"); }
  musDuck(false);

  var el=cur(); if(el){ el.classList.remove("cur","hint","bad"); el.classList.add("gone"); }
  btnSkip.hidden=true; S.state="ok";
  setStatus("已放棄這關，前進！");
  setTimeout(function(){ S.idx++; if(S.idx>=S.words.length) finish(); else runToCurrent(); },600);
});

}
btnStart.addEventListener("click",function(){
  if(btnStart.disabled) return;
  actx();     /* 在使用者手勢中解鎖音效 */

  envNote.textContent="正在開啟麥克風…請按「允許」（整場遊戲只需授權這一次）";

    go();
  });
});
